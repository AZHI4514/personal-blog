server:
  port: ${PORT:8080}

spring:
  application:
    name: blog-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:blog_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.azhi.pojo

file:
  upload:
    path: ${UPLOAD_PATH:./uploads}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

langchain4j:
  open-ai:
    chat-model:
      base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      api-key: ${MIMO_API_KEY:tp-cryglsfplp9hp21tg6m4iieone93cq6fx5nxoc1eo9gx3oce}
      model-name: mimo-v2.5
    streaming-chat-model:
      base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      api-key: ${MIMO_API_KEY:tp-cryglsfplp9hp21tg6m4iieone93cq6fx5nxoc1eo9gx3oce}
      model-name: mimo-v2.5

