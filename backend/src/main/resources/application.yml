server:
  port: ${PORT}

spring:
  application:
    name: blog-backend
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.azhi.pojo

file:
  upload:
    path: ${UPLOAD_PATH:./uploads}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}

langchain4j:
  open-ai:
    chat-model:
      base-url: ${MIMO_BASE_URL}  # 替换为你的模型服务地址
      api-key: ${MIMO_API_KEY}  # 替换为你的API密钥，建议通过环境变量传入
      model-name: mimo-v2.5  # 替换为你的模型名称

aliyun:
  api-key: ${DASHSCOPE_API_KEY}
